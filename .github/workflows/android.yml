name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and unit test
        run: ./gradlew assembleDebug testDebugUnitTest --stacktrace

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S core/audio/src/test/cpp -B build/native-tests -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/native-tests -j

      - name: Test
        run: ctest --test-dir build/native-tests --output-on-failure --no-tests=error
