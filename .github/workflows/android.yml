name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and unit test
        run: ./gradlew assembleDebug testDebugUnitTest --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk loopcam-debug-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: loopcam-debug-apk
          path: loopcam-debug-${{ github.run_number }}.apk

      # Release con la APK para poder bajarla directo desde el navegador del teléfono.
      - name: Publish debug release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: LoopCam debug ${{ github.run_number }} (${{ github.ref_name }})
          prerelease: true
          body: |
            APK de prueba (debug) del commit ${{ github.sha }} en `${{ github.ref_name }}`.
            Firmada con la clave debug del runner de CI: para instalar una versión nueva quizás haya que desinstalar la anterior.
          files: loopcam-debug-${{ github.run_number }}.apk

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S core/audio/src/test/cpp -B build/native-tests -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/native-tests -j

      - name: Test
        run: ctest --test-dir build/native-tests --output-on-failure --no-tests=error
